<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مومو - صديقك لتعلم الصينية 🐼</title>
  <style>
    :root {
      --bg-color: #fff5f7;
      --primary: #ff758f;
      --primary-dark: #ff4d6d;
      --momo-bubble: #ffffff;
      --user-bubble: #ffccd5;
      --text-color: #4a4a4a;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      height: 92vh;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(255, 117, 143, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 3px solid #ffe5ec;
    }

    /* منطقة شخصية مومو */
    .momo-header {
      background: linear-gradient(135deg, #ff8fa3, #ffb3c1);
      padding: 20px;
      text-align: center;
      color: white;
      position: relative;
    }

    .momo-avatar {
      width: 85px;
      height: 85px;
      background: white;
      border-radius: 50%;
      margin: 0 auto 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      animation: float 3s ease-in-out infinite;
    }

    .momo-avatar.talking {
      animation: bounce 0.5s infinite alternate;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes bounce {
      from { transform: scale(1); }
      to { transform: scale(1.12); }
    }

    .momo-header h2 { margin: 0; font-size: 1.3rem; }
    .momo-header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.9; }

    /* منطقة المحادثة */
    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background-color: #fffafb;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 20px;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
      position: relative;
    }

    .momo-msg {
      background: var(--momo-bubble);
      align-self: flex-start;
      border-bottom-right-radius: 4px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      border: 1px solid #ffe5ec;
    }

    .user-msg {
      background: var(--user-bubble);
      color: #590d22;
      align-self: flex-end;
      border-bottom-left-radius: 4px;
    }

    .speak-btn {
      background: #ffe5ec;
      border: none;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 0.8rem;
      color: var(--primary-dark);
      cursor: pointer;
      margin-top: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .speak-btn:hover { background: #ffb3c1; color: white; }

    /* منطقة الإدخال */
    .input-area {
      padding: 15px;
      background: white;
      border-top: 1px solid #ffe5ec;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #ffe5ec;
      border-radius: 25px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--primary); }

    button.send-btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.send-btn:hover { background: var(--primary-dark); }
    button.send-btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="momo-header">
    <div class="momo-avatar" id="momoAvatar">🐼</div>
    <h2>مومو (Momo)</h2>
    <p>صديقك اللطيف لتعلم اللغة الصينية ✨</p>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="message momo-msg">
      ني هاو! (你好 - Nǐ hǎo) 🌸<br>
      أنا مومو! سعيد جداً بلقائك! مستعد لنتعلم أول كلمة صينية معاً اليوم؟ قل لي "مستعد" أو اسألني أي شيء! 🐼✨
      <br><button class="speak-btn" onclick="speakChinese('你好')">🔊 استمع للنطق</button>
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="تحدث مع مومو هنا..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const momoAvatar = document.getElementById('momoAvatar');
  let chatHistory = [];

  // استخراج الرموز الصينية لنطقها صوتياً
  function extractChinese(text) {
    const matches = text.match(/[\u4e00-\u9fa5]+/g);
    return matches ? matches.join('，') : '';
  }

  // نطق النص الصيني باستخدام ميزة المتصفح الصوتية
  function speakChinese(text) {
    if (!text) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.85; // سرعة مناسبة للمتعلمين
    
    momoAvatar.classList.add('talking');
    utterance.onend = () => momoAvatar.classList.remove('talking');
    
    window.speechSynthesis.speak(utterance);
  }

  function appendMessage(text, isUser) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${isUser ? 'user-msg' : 'momo-msg'}`;
    msgDiv.textContent = text;

    if (!isUser) {
      const chineseText = extractChinese(text);
      if (chineseText) {
        const btn = document.createElement('button');
        btn.className = 'speak-btn';
        btn.innerHTML = '🔊 استمع للصينية';
        btn.onclick = () => speakChinese(chineseText);
        msgDiv.appendChild(document.createElement('br'));
        msgDiv.appendChild(btn);
      }
    }

    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage(text, true);
    userInput.value = '';
    sendBtn.disabled = true;
    momoAvatar.textContent = '🤔';

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: chatHistory })
      });

      const data = await response.json();

      if (data.reply) {
        appendMessage(data.reply, false);
        chatHistory.push({ role: 'user', parts: [{ text }] });
        chatHistory.push({ role: 'model', parts: [{ text: data.reply }] });
        
        // نطق الكلمات الصينية تلقائياً
        const chinesePart = extractChinese(data.reply);
        if (chinesePart) speakChinese(chinesePart);
      } else {
        appendMessage('عذراً، واجهت مشكلة صغيرة: ' + (data.error || 'خطأ غير معروف'), false);
      }
    } catch (err) {
      appendMessage('يبدو أن هناك مشكلة في الاتصال بالشبكة 🐼💔', false);
    } finally {
      sendBtn.disabled = false;
      momoAvatar.textContent = '🐼';
      userInput.focus();
    }
  }
</script>

</body>
</html>
